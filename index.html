<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>واجهة Telegram Mini App</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --accent: #1D976C;
    --accent-dark: #157553;
    --bg: #1c1c1e;
    --card-bg: #2c2c2e;
    --text: #ffffff;
    --hint: #8e8e93;
    --separator: #3a3a3c;
  }

  * { box-sizing: border-box; }

  body{
    margin: 0;
    font-family: "Tajawal", -apple-system, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 24px 16px 100px;
    min-height: 100vh;
  }

  /* ===== رأس الصفحة على طراز بطاقة تعريف (مثل BotFather) ===== */
  .profile{
    text-align: center;
    padding: 4px 20px 22px;
  }
  .avatar-lg{
    width: 92px;
    height: 92px;
    border-radius: 50%;
    margin: 0 auto 16px;
    background: linear-gradient(145deg, var(--accent), var(--accent-dark));
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 38px;
    box-shadow: 0 10px 28px rgba(29,151,108,.35);
  }
  .profile h1{
    font-size: 21px;
    font-weight: 800;
    margin: 0 0 8px;
  }
  .profile-desc{
    font-size: 14px;
    line-height: 1.7;
    color: var(--hint);
    max-width: 300px;
    margin: 0 auto;
  }
  .profile-desc a{
    color: var(--accent);
    text-decoration: none;
    font-weight: 700;
  }

  /* ===== شريط البحث ===== */
  .search-bar{
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--card-bg);
    border-radius: 12px;
    padding: 11px 14px;
    margin: 18px 4px 4px;
  }
  .search-bar svg{ flex-shrink: 0; color: var(--hint); }
  .search-bar input{
    flex: 1;
    min-width: 0;
    background: transparent;
    border: none;
    outline: none;
    color: var(--text);
    font-family: inherit;
    font-size: 14.5px;
  }
  .search-bar input::placeholder{ color: var(--hint); }

  .section-label{
    font-size: 13px;
    font-weight: 700;
    color: var(--text);
    margin: 22px 8px 8px;
  }

  /* ===== بطاقة تجمّع الصفوف ===== */
  .card{
    background: var(--card-bg);
    border-radius: 14px;
    overflow: hidden;
  }
  .card + .card{ margin-top: 12px; }

  .row{
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 12px 14px;
    border-bottom: 1px solid var(--separator);
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .row:last-child{ border-bottom: none; }

  .row-main{
    display: flex;
    align-items: center;
    gap: 12px;
    min-width: 0;
  }

  .row-icon{
    width: 26px;
    height: 26px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 19px;
    line-height: 1;
  }
  .row-icon img{
    width: 100%;
    height: 100%;
    object-fit: contain;
  }
  .row-icon.accent{ color: var(--accent); }
  .row-icon.danger{ color: #ff453a; }

  .row-text{ min-width: 0; }
  .row-label{
    font-size: 15px;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .row-label.accent{ color: var(--accent); }
  .row-label.danger{ color: #ff453a; }

  .row-hint{
    font-size: 12.5px;
    color: var(--hint);
    margin-top: 2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .chevron{
    color: var(--hint);
    font-size: 18px;
    flex-shrink: 0;
  }

  /* ===== مفتاح Switch بأسلوب تيليجرام/iOS ===== */
  .switch{
    position: relative;
    width: 48px;
    height: 29px;
    flex-shrink: 0;
  }
  .switch input{
    opacity: 0;
    width: 0;
    height: 0;
  }
  .switch-track{
    position: absolute;
    inset: 0;
    background: var(--separator);
    border-radius: 999px;
    overflow: hidden;
    transition: background .2s ease;
  }
  .switch-thumb{
    position: absolute;
    top: 2px;
    left: 2px;
    width: 25px;
    height: 25px;
    background: #fff;
    border-radius: 50%;
    box-shadow: 0 2px 4px rgba(0,0,0,.3);
    transition: transform .2s ease;
    will-change: transform;
  }
  .switch input:checked + .switch-track{
    background: var(--accent);
  }
  .switch input:checked + .switch-track .switch-thumb{
    transform: translateX(19px);
  }
</style>
</head>
<body>

  <!-- رأس البطاقة التعريفية -->
  <div class="profile">
    <div class="avatar-lg">⚙️</div>
    <h1>الإعدادات</h1>
    <p class="profile-desc">تحكّم في تفضيلاتك وإدارة إشعاراتك وحسابك من هنا. <a href="#">مزيد</a></p>
  </div>

  <!-- شريط بحث -->
  <div class="search-bar">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="11" cy="11" r="7"></circle>
      <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
    </svg>
    <input type="text" placeholder="بحث">
  </div>

  <!-- التفضيلات -->
  <div class="section-label">التفضيلات</div>
  <div class="card">
    <div class="row" id="notifRow">
      <div class="row-main">
        <div class="row-icon">🔔</div>
        <div class="row-text">
          <div class="row-label">الإشعارات</div>
          <div class="row-hint">تلقّي تنبيهات فورية</div>
        </div>
      </div>
      <label class="switch">
        <input type="checkbox" id="notifSwitch" checked>
        <span class="switch-track"><span class="switch-thumb"></span></span>
      </label>
    </div>

    <div class="row" id="soundRow">
      <div class="row-main">
        <div class="row-icon">🔊</div>
        <div class="row-text">
          <div class="row-label">الصوت والاهتزاز</div>
        </div>
      </div>
      <label class="switch">
        <input type="checkbox" id="soundSwitch">
        <span class="switch-track"><span class="switch-thumb"></span></span>
      </label>
    </div>

    <div class="row" id="langRow">
      <div class="row-main">
        <div class="row-icon"><img src="https://c.top4top.io/p_38546vm5q1.png" alt="اللغة"></div>
        <div class="row-text">
          <div class="row-label">اللغة</div>
          <div class="row-hint">العربية</div>
        </div>
      </div>
      <span class="chevron">‹</span>
    </div>
  </div>

  <!-- الإجراءات -->
  <div class="section-label">إجراءات</div>

  <div class="card">
    <div class="row" id="saveBtn">
      <div class="row-main">
        <div class="row-icon accent">＋</div>
        <div class="row-text">
          <div class="row-label accent">حفظ التغييرات</div>
        </div>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="row" id="shareBtn">
      <div class="row-main">
        <div class="row-icon">↗</div>
        <div class="row-text">
          <div class="row-label">مشاركة</div>
          <div class="row-hint">إرسال رابط الإعدادات</div>
        </div>
      </div>
      <span class="chevron">‹</span>
    </div>

    <div class="row" id="deleteBtn">
      <div class="row-main">
        <div class="row-icon danger">🗑</div>
        <div class="row-text">
          <div class="row-label danger">حذف الحساب</div>
        </div>
      </div>
      <span class="chevron">‹</span>
    </div>
  </div>

<script>
  const tg = window.Telegram?.WebApp;

  if (tg) {
    tg.ready();
    tg.expand();

    tg.setHeaderColor('#1c1c1e');
    tg.setBackgroundColor('#1c1c1e');
    tg.setBottomBarColor('#1c1c1e');

    tg.MainButton.setParams({
      text: 'حفظ التغييرات',
      color: '#1D976C',
      text_color: '#ffffff',
      is_visible: true
    });
    tg.MainButton.onClick(() => {
      tg.HapticFeedback.notificationOccurred('success');
      tg.showAlert('تم الحفظ بنجاح');
    });
  }

  document.querySelectorAll('.switch input').forEach(sw => {
    sw.addEventListener('change', () => {
      tg?.HapticFeedback?.selectionChanged();
    });
  });

  document.getElementById('saveBtn').addEventListener('click', () => {
    tg?.HapticFeedback?.impactOccurred('medium');
    tg ? tg.showAlert('تم الحفظ بنجاح') : alert('تم الحفظ بنجاح');
  });

  document.getElementById('shareBtn').addEventListener('click', () => {
    tg?.HapticFeedback?.impactOccurred('light');
  });

  document.getElementById('deleteBtn').addEventListener('click', () => {
    if (tg) {
      tg.showConfirm('هل أنت متأكد من حذف الحساب؟', (ok) => {
        if (ok) tg.HapticFeedback.notificationOccurred('warning');
      });
    } else if (confirm('هل أنت متأكد من حذف الحساب؟')) {
      // منطق الحذف
    }
  });
</script>
</body>
</html>
