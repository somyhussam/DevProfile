<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <title>Web Push Notifications</title>

    <style>
        body{
            font-family:Arial;
            margin:40px;
            text-align:center;
            background:#f5f5f5;
        }

        button{
            padding:15px 35px;
            font-size:18px;
            cursor:pointer;
        }

        pre{
            text-align:left;
            background:white;
            padding:15px;
            border-radius:8px;
            overflow:auto;
            margin-top:20px;
        }
    </style>
</head>

<body>

<h1>تفعيل إشعارات الموقع</h1>

<button onclick="subscribe()">
تفعيل الإشعارات
</button>

<pre id="result"></pre>

<script>

const PUBLIC_VAPID_KEY =
"ضع_المفتاح_العام_هنا";

function urlBase64ToUint8Array(base64String){

    const padding = "=".repeat((4 - base64String.length % 4) % 4);

    const base64 = (base64String + padding)
        .replace(/-/g,"+")
        .replace(/_/g,"/");

    const rawData = atob(base64);

    return Uint8Array.from([...rawData].map(c=>c.charCodeAt(0)));

}

async function subscribe(){

    if(!("serviceWorker" in navigator)){
        alert("المتصفح لا يدعم Service Worker");
        return;
    }

    if(!("PushManager" in window)){
        alert("المتصفح لا يدعم Push");
        return;
    }

    const registration =
        await navigator.serviceWorker.register("sw.js");

    const permission =
        await Notification.requestPermission();

    if(permission!="granted"){
        alert("تم رفض الإذن");
        return;
    }

    const subscription =
        await registration.pushManager.subscribe({

            userVisibleOnly:true,

            applicationServerKey:
            urlBase64ToUint8Array(PUBLIC_VAPID_KEY)

        });

    document.getElementById("result").textContent =
        JSON.stringify(subscription,null,4);

    // إرسال الاشتراك إلى السيرفر

    await fetch("/subscribe",{

        method:"POST",

        headers:{
            "Content-Type":"application/json"
        },

        body:JSON.stringify(subscription)

    });

    alert("تم الاشتراك بنجاح");

}

</script>

</body>
</html>
